
<div class="container mt-4">
  <h2 class="mb-4">Upcoming Events</h2>

  <!-- Filter Section -->
  <div class="filters d-flex flex-wrap align-items-center mb-4 p-3 bg-light rounded shadow-sm">
    <div class="filter-group me-3 mb-2">
      <label for="titleSelect" class="form-label fw-bold me-2">Event Title:</label>
      <select id="titleSelect" [(ngModel)]="selectedTitle" (change)="onFilterChange()" class="form-select">
        <option value="">-- All Titles --</option>
        <option *ngFor="let title of eventTitles" [value]="title">{{ title }}</option>
      </select>
    </div>

    <div class="filter-group mb-2">
      <label for="categorySelect" class="form-label fw-bold me-2">Category:</label>
      <select id="categorySelect" [(ngModel)]="selectedCategory" (change)="onFilterChange()" class="form-select">
        <option value="">-- All Categories --</option>
        <option *ngFor="let category of eventCategories" [value]="category">{{ category }}</option>
      </select>
    </div>
  </div>

  <!-- Status messages -->
  <div *ngIf="isLoading" class="text-muted">Loading events...</div>
  <div *ngIf="errorMessage" class="text-danger">{{ errorMessage }}</div>

  <!-- Event list -->
  <div *ngIf="!isLoading && !errorMessage">
    <div *ngFor="let ev of filteredEvents" class="event-box my-3">
      <h5>{{ ev.Title }}</h5>
      <p>
        <strong>Category:</strong> {{ ev.Category }}<br />
        <strong>Date:</strong> {{ ev.Start | date: 'medium' }}
      </p>
      <p>{{ ev.Description }}</p>

      <a *ngIf="ev.MoreInfoUrl" [href]="ev.MoreInfoUrl" target="_blank" class="btn btn-outline-primary">
        Read More
      </a>
      <p>
        <a [routerLink]="['/events', ev.Id]" class="btn btn-primary ms-2">
          View Details
        </a>
      </p>
    </div>

    <div *ngIf="filteredEvents.length === 0" class="text-muted mt-3">
      No events found.
    </div>
  </div>
</div>
